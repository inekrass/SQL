x-clickhouse-common: &clickhouse-common
  image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.3}
  restart: unless-stopped
  networks:
    - clickhouse-net
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  depends_on:
    - keeper-1
    - keeper-2
    - keeper-3
  volumes:
    - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d:ro

x-keeper-common: &keeper-common
  image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.3}
  restart: unless-stopped
  networks:
    - clickhouse-net
  command: ["clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper_config.xml"]
  volumes:
    - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro

services:
  ch-s1-r1:
    <<: *clickhouse-common
    hostname: ch-s1-r1
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "01"
      CLICKHOUSE_REPLICA: "ch-s1-r1"
    volumes:
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ch-s1-r1-data:/var/lib/clickhouse
      - ch-s1-r1-logs:/var/log/clickhouse-server

  ch-s1-r2:
    <<: *clickhouse-common
    hostname: ch-s1-r2
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "01"
      CLICKHOUSE_REPLICA: "ch-s1-r2"
    volumes:
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ch-s1-r2-data:/var/lib/clickhouse
      - ch-s1-r2-logs:/var/log/clickhouse-server

  ch-s2-r1:
    <<: *clickhouse-common
    hostname: ch-s2-r1
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "02"
      CLICKHOUSE_REPLICA: "ch-s2-r1"
    volumes:
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ch-s2-r1-data:/var/lib/clickhouse
      - ch-s2-r1-logs:/var/log/clickhouse-server

  ch-s2-r2:
    <<: *clickhouse-common
    hostname: ch-s2-r2
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "02"
      CLICKHOUSE_REPLICA: "ch-s2-r2"
    volumes:
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ch-s2-r2-data:/var/lib/clickhouse
      - ch-s2-r2-logs:/var/log/clickhouse-server

  keeper-1:
    <<: *keeper-common
    hostname: keeper-1
    environment:
      KEEPER_SERVER_ID: "1"
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-1-data:/var/lib/clickhouse
      - keeper-1-logs:/var/log/clickhouse-server

  keeper-2:
    <<: *keeper-common
    hostname: keeper-2
    environment:
      KEEPER_SERVER_ID: "2"
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-2-data:/var/lib/clickhouse
      - keeper-2-logs:/var/log/clickhouse-server

  keeper-3:
    <<: *keeper-common
    hostname: keeper-3
    environment:
      KEEPER_SERVER_ID: "3"
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-3-data:/var/lib/clickhouse
      - keeper-3-logs:/var/log/clickhouse-server

  nginx:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    depends_on:
      - ch-s1-r1
      - ch-s1-r2
      - ch-s2-r1
      - ch-s2-r2
    networks:
      - clickhouse-net
    ports:
      - "8123:8123"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    restart: unless-stopped
    networks:
      - clickhouse-net
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.1}
    restart: unless-stopped
    networks:
      - clickhouse-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

networks:
  clickhouse-net:
    driver: bridge

volumes:
  ch-s1-r1-data:
  ch-s1-r1-logs:
  ch-s1-r2-data:
  ch-s1-r2-logs:
  ch-s2-r1-data:
  ch-s2-r1-logs:
  ch-s2-r2-data:
  ch-s2-r2-logs:
  keeper-1-data:
  keeper-1-logs:
  keeper-2-data:
  keeper-2-logs:
  keeper-3-data:
  keeper-3-logs:
  prometheus-data:
  grafana-data:
