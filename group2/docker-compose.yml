services:
  postgres:
    image: postgres:16
    container_name: group2_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/pg/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/pg:/sql/pg:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop_user} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: group2_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_password}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./sql/ch:/docker-entrypoint-initdb.d:ro
      - ./sql/ch:/sql/ch:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  manticore:
    image: manticoresearch/manticore:6.3.6
    container_name: group2_manticore
    ports:
      - "${MANTICORE_HTTP_PORT:-9308}:9308"
      - "${MANTICORE_SQL_PORT:-9306}:9306"
    volumes:
      - manticore_data:/var/lib/manticore
      - ./sql/manticore:/sql/manticore:ro
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "mysql", "-h0", "-P9306", "-e", "SHOW TABLES"]
      interval: 5s
      timeout: 5s
      retries: 20

  metrics-exporter:
    image: python:3.11-slim
    container_name: group2_metrics_exporter
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_password}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_password}
      MANTICORE_HOST: manticore
      MANTICORE_SQL_PORT: 9306
      METRICS_EXPORTER_PORT: 9180
    ports:
      - "${METRICS_EXPORTER_PORT:-9180}:9180"
    volumes:
      - .:/app
    command: >
      sh -c "pip install --no-cache-dir -r scripts/requirements.txt
      && python monitoring/metrics_exporter.py"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      manticore:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: group2_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - metrics-exporter

  grafana:
    image: grafana/grafana:11.3.1
    container_name: group2_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg_data:
  ch_data:
  manticore_data:
  prometheus_data:
  grafana_data:
