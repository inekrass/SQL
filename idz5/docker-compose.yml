services:
  manticore:
    image: manticoresearch/manticore:latest
    container_name: idz5_manticore
    restart: unless-stopped
    ports:
      - "127.0.0.1:9306:9306"
      - "127.0.0.1:9308:9308"
      - "127.0.0.1:9312:9312"
    volumes:
      - manticore_data:/var/lib/manticore
    ulimits:
        nproc: 65535
        nofile:
            soft: 65535
            hard: 65535
        memlock:
            soft: -1
            hard: -1

volumes:
  manticore_data: